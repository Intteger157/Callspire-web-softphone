# ─────────────────────────────────────────────────────────────────────────────
# Callspire Web Softphone — nginx reverse-proxy example
#
# Architecture (single upstream):
#
#   Browser  ──HTTPS──►  nginx  ──HTTP──►  Callspire PBX Gateway (uvicorn)
#
# The PBX Gateway mounts both the FastAPI REST layer (/api/v1/*) and the
# browser-facing softphone layer at /softphone/* (static SPA + /api/*).
# No Node.js BFF is required in production.
#
# MikoPBX Asterisk (WSS) is connected directly from the browser — nginx does
# NOT proxy the WebSocket SIP traffic.  The browser resolves the WSS URL
# returned by GET /api/webrtc/config and opens a direct TLS connection.
#
# ─────────────────────────────────────────────────────────────────────────────

upstream pbx_gateway {
    # Adjust host/port to match your uvicorn / gunicorn bind address.
    server 127.0.0.1:8005;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name softphone.example.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name softphone.example.com;

    # TLS certificate (Let's Encrypt / your CA)
    ssl_certificate     /etc/letsencrypt/live/softphone.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softphone.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy to the PBX Gateway ─────────────────────────────────────────────
    location / {
        proxy_pass         http://pbx_gateway;

        # Standard proxy headers — required so the gateway can reconstruct
        # full URLs and set the Secure flag on the session cookie correctly.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive between nginx and uvicorn.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Timeouts — increase if recording downloads are large.
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout    120s;

        # Buffer sizes for API JSON responses.
        proxy_buffers         8 16k;
        proxy_buffer_size     16k;
    }

    # Optional: if the gateway is deployed at a sub-path
    # (e.g. SOFTPHONE_BASE=/softphone on a shared host) and nginx rewrites,
    # pass X-Forwarded-Prefix so the gateway knows the public prefix:
    #
    #   proxy_set_header X-Forwarded-Prefix /softphone;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_types      application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
}


# ─────────────────────────────────────────────────────────────────────────────
# MikoPBX Asterisk — WebRTC / WSS TLS requirements
# ─────────────────────────────────────────────────────────────────────────────
#
# The browser establishes a WebSocket SIP session DIRECTLY to Asterisk over
# WSS.  nginx is NOT in that path.  Requirements:
#
# 1. Valid TLS certificate on Asterisk (wss://pbx.example.com:8089/ws).
#    - Browsers refuse WSS connections to untrusted / self-signed certificates.
#    - Use a certificate from Let's Encrypt or a commercial CA.
#    - Self-signed certs only work after the user manually visits the Asterisk
#      HTTPS URL in the browser and accepts the security exception.
#
# 2. Asterisk http.conf (or pjsip.conf transport):
#       [general]
#       tlsenable=yes
#       tlsbindaddr=0.0.0.0:8089
#       tlscertfile=/etc/asterisk/keys/asterisk.pem
#       tlsprivatekey=/etc/asterisk/keys/asterisk.key
#
# 3. Firewall: TCP 8089 open from the internet (or at least from your nginx
#    public IP if Asterisk is on the same LAN).
#
# 4. SIP auth user pattern: the gateway returns sipAuthUser = "<ext>-WS"
#    (e.g. "1001-WS").  Ensure the corresponding PJSIP auth object exists:
#       [1001-WS]
#       type=auth
#       auth_type=userpass
#       username=1001-WS
#       password=<random>
#
# 5. TURN servers (optional, for NAT traversal):
#    Set WEBRTC_TURN_URLS / WEBRTC_TURN_USERNAME / WEBRTC_TURN_PASSWORD on the
#    PBX Gateway.  The gateway injects these into GET /api/webrtc/config so the
#    browser uses them automatically.
# ─────────────────────────────────────────────────────────────────────────────
